<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout5</title>

    <style>
           /* 초기화 */
            * {
                margin: 0;
                padding: 0;
                font: normal 12px '돋움';
            }

            ul, ol { list-style: none; }
            a { text-decoration: none; color: #111; }
            input, textarea { outline: none; }

            /* container */
            #container {
                width: 800px;
                height: auto;
                border: 1px solid black;
                box-sizing: border-box;
                padding: 10px;
                margin: 0 auto;
            }

            main {
                width: 100%;
                min-height: 400px;
                border: 1px dashed black;
                box-sizing: border-box;
                padding: 10px;
                background-color: #eee;
                margin: 10px 0;
                overflow: hidden;
            }

            main > aside, main > section {
                background-color: #ccc;
                height: 400px;
                border: 1px dashed black;
                box-sizing: border-box;
            }

            main > aside {
                width: 216px;
                float: right;
            }

            main > section {
                width: 530px;
                margin-right: 10px;
            }

            header {
                width: 100%;
                height: 120px;
                background-color: #111  #eee;
                background-color: #eee;
                border: 1px dashed black;
                box-sizing: border-box;
            }

            footer {
                width: 100%;
                height: 120px;
                background-color: #111  #eee;
                background-color: #eee;
                border: 1px dashed black;
            }

    </style>
</head>
<body>
    <div id="container">
    <header>header</header>
    <main>
        <p>main</p>
        <aside>aside</aside>
        <section>section</section>
    </main>
    <footer>footer</footer>
    </div>
</body>
</html>
