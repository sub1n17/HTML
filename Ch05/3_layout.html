<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>layout3</title>

        <style>
              /* 초기화 */
            * {
                margin: 0;
                padding: 0;
                font: normal 12px '돋움';
            }

            ul, ol { list-style: none; }
            a { text-decoration: none; color: #111; }
            input, textarea { outline: none; }

            /* container */
            #container {
                width: 800px;
                height: auto;
                border: 1px solid black;
                box-sizing: border-box;
                padding: 10px;
                margin: 0 auto;
            }

            header {
                width: 100%;
                height: 120px;
                background-color: #111  #eee;
                background-color: #eee;
                border: 1px dashed black;
                box-sizing: border-box;
            }

            main {
                width: 100%;
                min-height: 400px;
                background-color: #eee;
                border: 1px dashed black;
                box-sizing: border-box;
                margin: 10px 0;
                padding: 10px;
            }

            main > section {
                width: 100%;
                min-height: 400px;
                border: 1px dashed black;
                box-sizing: border-box;
                background-color: #ddd;
                padding: 10px;
            }

            main > section:nth-child(1) {
                margin-bottom: 10px;
            }

            main article {
                height: 200px;
                background-color: #ccc;
            }

            main article:nth-child(1) {
                margin-bottom: 10px;
            }

            footer {
                width: 100%;
                height: 120px;
                background-color: #111  #eee;
                background-color: #eee;
                border: 1px dashed black;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <div id="container">
        <header>header</header>
        <main>
            main
            <section>
            section #1
                <article>article #1</article>
                <article>article #2</article>
            </section>
            <section>
                section #2
                <article>article #1</article>
                <article>article #2</article>
            </section>
        </main>
        <footer>footer</footer>
        </div>
    </body>
</html>
