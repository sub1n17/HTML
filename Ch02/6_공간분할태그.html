<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>공간분할태그</title>
    </head>
    <body>
        <h3>6. 공간 분할 태그</h3>

        <h4>block 형식 태그</h3>
        <div>div 태그 1</div> <!-- division -->
        <div>div 태그 2</div>
        <div>div 태그 3</div>

        <p>
            동해물과 백두산이
        </p>
        <p>
            마르고 닳도록
        </p>
        
        <!-- **************************************** -->
        <h4>inline 형식 태그</h3>
        <span>span 태그 1</span>
        <span>span 태그 2</span>
        <span>span 태그 3</span>

        <a href="#">네이버</a>
        <a href="#">다음</a>
        
        <!-- **************************************** -->
        <h4>inline-block 태그</h3> <!-- 가로로 출력되는 inline + 가로세로 크기 지원하는 block -->
        <img src="./images/flower1.jpg" alt="벚꽃" width="100">
        <img src="./images/flower2.jpg" alt="코스모스" height="100">

        <input type="text" size="10">

    </body>
</html>
